name: Package KeyScale

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read and validate release version
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("manifest.xml").findtext("Version"))')"
          RELEASE_TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION" >&2
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "FILENAME=com.penchi.KeyScale_${RELEASE_TAG}.xrnx"
          } >> "$GITHUB_ENV"

      - name: Build Renoise installer
        run: |
          bash build.sh
          mv com.penchi.KeyScale.xrnx "$FILENAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$FILENAME" \
            --target "$GITHUB_SHA" \
            --title "KeyScale $VERSION" \
            --generate-notes \
            --latest
